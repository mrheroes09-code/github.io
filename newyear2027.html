<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер обратного отсчёта до Нового года 2027</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            transition: background 2s ease;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        /* ========== ФОНЫ ДЛЯ ВРЕМЕНИ СУТОК ========== */
        body.morning.clear {
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4B5 50%, #FFDAB9 100%);
        }
        body.morning.cloudy {
            background: linear-gradient(180deg, #B0C4DE 0%, #D3D3D3 50%, #C0C0C0 100%);
        }
        body.morning.rain {
            background: linear-gradient(180deg, #708090 0%, #A9A9A9 50%, #808080 100%);
        }
        body.morning.snow {
            background: linear-gradient(180deg, #E8E8E8 0%, #F5F5F5 50%, #FFFFFF 100%);
        }
        body.morning.thunderstorm {
            background: linear-gradient(180deg, #4A4A5A 0%, #6B6B7B 50%, #3A3A4A 100%);
        }
        body.morning.default-bg {
            background: linear-gradient(180deg, #87CEEB 0%, #FFE4B5 100%);
        }

        body.day.clear {
            background: linear-gradient(180deg, #1E90FF 0%, #87CEEB 50%, #FFE4B5 100%);
        }
        body.day.cloudy {
            background: linear-gradient(180deg, #778899 0%, #B0C4DE 50%, #C0C0C0 100%);
        }
        body.day.rain {
            background: linear-gradient(180deg, #5C5C6E 0%, #7A7A8C 50%, #6B6B7B 100%);
        }
        body.day.snow {
            background: linear-gradient(180deg, #C8C8D0 0%, #E0E0E8 50%, #D8D8E0 100%);
        }
        body.day.thunderstorm {
            background: linear-gradient(180deg, #3D3D4D 0%, #5A5A6E 50%, #2D2D3D 100%);
        }
        body.day.default-bg {
            background: linear-gradient(180deg, #1E90FF 0%, #87CEEB 100%);
        }

        body.evening.clear {
            background: linear-gradient(180deg, #FF6347 0%, #FF7F50 30%, #4B0082 70%, #191970 100%);
        }
        body.evening.cloudy {
            background: linear-gradient(180deg, #8B4513 0%, #A0522D 30%, #2F1B4E 70%, #1A1A4E 100%);
        }
        body.evening.rain {
            background: linear-gradient(180deg, #4A4A5E 0%, #5C5C70 30%, #2A2A4A 70%, #1A1A3A 100%);
        }
        body.evening.snow {
            background: linear-gradient(180deg, #B0A0B0 0%, #C8B8C8 30%, #6A5A7A 70%, #3A2A4A 100%);
        }
        body.evening.thunderstorm {
            background: linear-gradient(180deg, #2D1B2E 0%, #3D2B3E 30%, #1D0B1E 70%, #0D0B1E 100%);
        }
        body.evening.default-bg {
            background: linear-gradient(180deg, #FF6347 0%, #4B0082 70%, #191970 100%);
        }

        body.night.clear {
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 40%, #0d0d3d 70%, #000020 100%);
        }
        body.night.cloudy {
            background: linear-gradient(180deg, #151530 0%, #202045 40%, #101030 70%, #0a0a20 100%);
        }
        body.night.rain {
            background: linear-gradient(180deg, #0d0d25 0%, #181838 40%, #0b0b25 70%, #050520 100%);
        }
        body.night.snow {
            background: linear-gradient(180deg, #1a1a35 0%, #252545 40%, #151535 70%, #0a0a25 100%);
        }
        body.night.thunderstorm {
            background: linear-gradient(180deg, #0b0b20 0%, #151530 40%, #0a0a20 70%, #040415 100%);
        }
        body.night.default-bg {
            background: linear-gradient(180deg, #0a0a2e 0%, #1a1a4e 50%, #000020 100%);
        }

        /* Звёзды для ясной ночи */
        body.night.clear::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
                radial-gradient(1px 1px at 25% 35%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 40% 15%, #fff, transparent),
                radial-gradient(1px 1px at 55% 45%, #fff, transparent),
                radial-gradient(2px 2px at 70% 25%, #fff, transparent),
                radial-gradient(1px 1px at 85% 40%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 15% 55%, #fff, transparent),
                radial-gradient(1px 1px at 35% 65%, #fff, transparent),
                radial-gradient(2px 2px at 60% 55%, #fff, transparent),
                radial-gradient(1px 1px at 80% 70%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 5% 75%, #fff, transparent),
                radial-gradient(1px 1px at 20% 85%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 50% 80%, #fff, transparent),
                radial-gradient(1px 1px at 75% 85%, #fff, transparent),
                radial-gradient(2px 2px at 90% 60%, #fff, transparent);
            pointer-events: none;
            z-index: 0;
            animation: twinkle 4s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Дождь */
        body.rain-effect::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.15) 2px,
                    rgba(255, 255, 255, 0.15) 4px
                );
            pointer-events: none;
            z-index: 1;
            animation: rain 0.5s linear infinite;
        }

        @keyframes rain {
            from { transform: translateY(-100%); }
            to { transform: translateY(100%); }
        }

        /* Снег */
        body.snow-effect::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(3px 3px at 15% 10%, #fff, transparent),
                radial-gradient(4px 4px at 35% 25%, #fff, transparent),
                radial-gradient(2px 2px at 55% 15%, #fff, transparent),
                radial-gradient(3px 3px at 75% 30%, #fff, transparent),
                radial-gradient(2px 2px at 90% 20%, #fff, transparent),
                radial-gradient(4px 4px at 20% 45%, #fff, transparent),
                radial-gradient(2px 2px at 45% 55%, #fff, transparent),
                radial-gradient(3px 3px at 65% 40%, #fff, transparent),
                radial-gradient(2px 2px at 80% 60%, #fff, transparent),
                radial-gradient(4px 4px at 10% 70%, #fff, transparent),
                radial-gradient(3px 3px at 30% 80%, #fff, transparent),
                radial-gradient(2px 2px at 50% 75%, #fff, transparent),
                radial-gradient(4px 4px at 70% 85%, #fff, transparent),
                radial-gradient(3px 3px at 85% 70%, #fff, transparent);
            background-size: 200px 300px;
            pointer-events: none;
            z-index: 1;
            animation: snow 8s linear infinite;
        }

        @keyframes snow {
            from { transform: translateY(-20%); }
            to { transform: translateY(20%); }
        }

        /* Молнии */
        body.thunderstorm-effect::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: none;
            z-index: 1;
            animation: lightning 8s ease-in-out infinite;
        }

        @keyframes lightning {
            0%, 92%, 94%, 100% { background: transparent; }
            93% { background: rgba(255, 255, 255, 0.3); }
            95% { background: rgba(255, 255, 255, 0.1); }
            96% { background: transparent; }
            97% { background: rgba(255, 255, 255, 0.2); }
        }

        /* ========== ОСНОВНОЙ КОНТЕЙНЕР ========== */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 30px;
            padding: 50px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
            max-width: 750px;
            width: 100%;
            transition: background 1s ease, border-color 1s ease;
        }

        .location-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.95em;
            letter-spacing: 1px;
            flex-wrap: wrap;
        }

        .location-dot {
            width: 8px;
            height: 8px;
            background: #4cff4c;
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 5px #4cff4c; }
            50% { box-shadow: 0 0 15px #4cff4c, 0 0 25px #4cff4c; }
        }

        .weather-icon {
            font-size: 1.4em;
        }

        .city-name {
            font-weight: 600;
            color: #ffffff;
        }

        /* Поле ввода города */
        .city-input-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .city-input {
            padding: 10px 16px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 0.9em;
            outline: none;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            width: 180px;
        }

        .city-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .city-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.25);
        }

        .city-btn {
            padding: 10px 20px;
            border-radius: 25px;
            border: none;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .city-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.5);
        }

        .city-btn:active {
            transform: scale(0.95);
        }

        h1 {
            color: #ffffff;
            font-size: 2.2em;
            margin-bottom: 5px;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9em;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .year-badge {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            padding: 8px 25px;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 35px;
            letter-spacing: 1px;
            box-shadow: 0 10px 30px rgba(245, 87, 108, 0.4);
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .timer-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px 15px;
            min-width: 110px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .timer-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
        }

        .number {
            display: block;
            font-size: 3.5em;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
            letter-spacing: 2px;
            animation: fadeIn 0.5s ease;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
        }

        .label {
            display: block;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.65);
            margin-top: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .weather-message {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95em;
            margin-top: 15px;
            font-style: italic;
            letter-spacing: 1px;
            line-height: 1.5;
        }

        /* Скрытый блок */
        .hidden {
            display: none;
        }

        /* Адаптив */
        @media (max-width: 600px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .timer {
                gap: 10px;
            }

            .timer-item {
                min-width: 75px;
                padding: 15px 8px;
            }

            .number {
                font-size: 2.2em;
            }

            .label {
                font-size: 0.7em;
            }

            .year-badge {
                font-size: 1em;
                padding: 6px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Автоматическое определение -->
        <div class="location-info" id="autoLocation">
            <span class="location-dot"></span>
            <span class="weather-icon" id="weatherIcon">📍</span>
            <span class="city-name" id="cityName">Определяем город...</span>
        </div>
        
        <!-- Ручной ввод города (изначально скрыт) -->
        <div class="location-info hidden" id="manualLocation">
            <span>🏙️</span>
            <div class="city-input-row">
                <input type="text" class="city-input" id="cityInput" placeholder="Введите город">
                <button class="city-btn" id="cityBtn">Узнать погоду</button>
            </div>
        </div>
        
        <h1>До Нового года осталось</h1>
        <p class="subtitle" id="timeOfDayLabel">✨</p>
        
        <div class="year-badge">2027</div>
        
        <div class="timer">
            <div class="timer-item">
                <span class="number" id="days">00</span>
                <span class="label">Дней</span>
            </div>
            <div class="timer-item">
                <span class="number" id="hours">00</span>
                <span class="label">Часов</span>
            </div>
            <div class="timer-item">
                <span class="number" id="minutes">00</span>
                <span class="label">Минут</span>
            </div>
            <div class="timer-item">
                <span class="number" id="seconds">00</span>
                <span class="label">Секунд</span>
            </div>
        </div>
        
        <p class="weather-message" id="weatherMessage">Загружаем погоду...</p>
    </div>

    <script>
        let userCity = '';
        let userLat = null;
        let userLon = null;
        let weatherCode = 'default-bg';
        let timeOfDay = 'day';

        // ========== ВРЕМЯ СУТОК ==========
        function getTimeOfDay(hours) {
            if (hours >= 6 && hours < 12) return 'morning';
            if (hours >= 12 && hours < 17) return 'day';
            if (hours >= 17 && hours < 21) return 'evening';
            return 'night';
        }

        function getTimeOfDayLabel(tod) {
            const labels = {
                'morning': '☀️ Доброе утро!',
                'day': '☀️ Добрый день!',
                'evening': '🌅 Добрый вечер!',
                'night': '🌙 Доброй ночи!'
            };
            return labels[tod] || '✨';
        }

        // ========== ГЕОКОДИНГ: название города → координаты ==========
        async function getCoordinatesByCity(cityName) {
            try {
                // Используем бесплатный Geocoding API от Open-Meteo
                const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=ru&format=json`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    const result = data.results[0];
                    return {
                        lat: result.latitude,
                        lon: result.longitude,
                        name: result.name,
                        country: result.country || ''
                    };
                }
                return null;
            } catch (error) {
                console.log('Ошибка геокодинга:', error);
                return null;
            }
        }

        // ========== ПОЛУЧЕНИЕ ГЕОЛОКАЦИИ ПО IP ==========
        async function getLocationByIP() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                if (!response.ok) throw new Error('IP API недоступен');
                const data = await response.json();
                
                if (data.city && data.latitude && data.longitude) {
                    userCity = data.city;
                    userLat = data.latitude;
                    userLon = data.longitude;
                    return true;
                }
                return false;
            } catch (error) {
                console.log('Ошибка геолокации по IP:', error);
                return false;
            }
        }

        // ========== ПОЛУЧЕНИЕ ПОГОДЫ ==========
        async function getWeather(lat, lon, cityName) {
            try {
                const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                const response = await fetch(url);
                if (!response.ok) throw new Error('Weather API недоступен');
                const data = await response.json();
                
                const code = data.current_weather.weathercode;
                weatherCode = getWeatherCode(code);
                
                const temp = Math.round(data.current_weather.temperature);
                const weatherDesc = getWeatherDescription(code);
                const weatherEmoji = getWeatherEmoji(code);
                
                userCity = cityName;
                document.getElementById('cityName').textContent = cityName;
                document.getElementById('weatherIcon').textContent = weatherEmoji;
                document.getElementById('weatherMessage').textContent = 
                    `${weatherDesc}, ${temp}°C в городе ${cityName}`;
                
                // Показываем автоматический блок, скрываем ручной
                document.getElementById('autoLocation').classList.remove('hidden');
                document.getElementById('manualLocation').classList.add('hidden');
                
                applyTheme();
                return true;
            } catch (error) {
                console.log('Ошибка погоды:', error);
                return false;
            }
        }

        // ========== ПОКАЗАТЬ РУЧНОЙ ВВОД ==========
        function showManualInput() {
            document.getElementById('autoLocation').classList.add('hidden');
            document.getElementById('manualLocation').classList.remove('hidden');
            document.getElementById('weatherMessage').textContent = 
                'Не удалось определить город автоматически. Введите ваш город вручную 👆';
            document.getElementById('cityName').textContent = 'Неизвестно';
            document.getElementById('weatherIcon').textContent = '🌍';
            applyTheme();
        }

        // ========== ОБРАБОТЧИК РУЧНОГО ВВОДА ==========
        async function handleManualCity() {
            const input = document.getElementById('cityInput');
            const city = input.value.trim();
            
            if (!city) {
                document.getElementById('weatherMessage').textContent = 'Пожалуйста, введите название города 👆';
                return;
            }
            
            document.getElementById('weatherMessage').textContent = 'Ищем город... 🔍';
            
            const coords = await getCoordinatesByCity(city);
            
            if (!coords) {
                document.getElementById('weatherMessage').textContent = 
                    `Город "${city}" не найден. Попробуйте другой вариант 👆`;
                return;
            }
            
            const success = await getWeather(coords.lat, coords.lon, coords.name);
            
            if (!success) {
                document.getElementById('weatherMessage').textContent = 
                    `Погода для города ${coords.name} недоступна 🌍`;
                document.getElementById('cityName').textContent = coords.name;
                document.getElementById('weatherIcon').textContent = '📍';
                document.getElementById('autoLocation').classList.remove('hidden');
                document.getElementById('manualLocation').classList.add('hidden');
                applyTheme();
            }
        }

        // ========== КОДЫ ПОГОДЫ ==========
        function getWeatherCode(code) {
            if (code === 0 || code === 1) return 'clear';
            if (code === 2 || code === 3) return 'cloudy';
            if (code >= 45 && code <= 48) return 'cloudy';
            if ((code >= 51 && code <= 57) || (code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
            if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return 'snow';
            if (code >= 95 && code <= 99) return 'thunderstorm';
            return 'default-bg';
        }

        function getWeatherDescription(code) {
            if (code === 0) return 'Ясно';
            if (code === 1) return 'Преимущественно ясно';
            if (code === 2) return 'Переменная облачность';
            if (code === 3) return 'Пасмурно';
            if (code >= 45 && code <= 48) return 'Туман';
            if (code >= 51 && code <= 55) return 'Морось';
            if (code >= 56 && code <= 57) return 'Ледяная морось';
            if (code === 61) return 'Небольшой дождь';
            if (code === 63) return 'Дождь';
            if (code === 65) return 'Сильный дождь';
            if (code >= 66 && code <= 67) return 'Ледяной дождь';
            if (code >= 71 && code <= 75) return 'Снег';
            if (code === 77) return 'Снежные зёрна';
            if (code >= 80 && code <= 82) return 'Ливень';
            if (code >= 85 && code <= 86) return 'Снегопад';
            if (code === 95) return 'Гроза';
            if (code >= 96 && code <= 99) return 'Гроза с градом';
            return 'Переменная погода';
        }

        function getWeatherEmoji(code) {
            if (code === 0 || code === 1) return '☀️';
            if (code === 2) return '⛅';
            if (code === 3) return '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 57) return '🌧️';
            if (code >= 61 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '🌨️';
            if (code >= 80 && code <= 82) return '🌧️';
            if (code >= 85 && code <= 86) return '❄️';
            if (code >= 95 && code <= 99) return '⛈️';
            return '🌤️';
        }

        // ========== ПРИМЕНЕНИЕ ТЕМЫ ==========
        function applyTheme() {
            const body = document.body;
            
            body.classList.remove(
                'morning', 'day', 'evening', 'night',
                'clear', 'cloudy', 'rain', 'snow', 'thunderstorm', 'default-bg',
                'rain-effect', 'snow-effect', 'thunderstorm-effect'
            );
            
            body.classList.add(timeOfDay);
            body.classList.add(weatherCode);
            
            if (weatherCode === 'rain') body.classList.add('rain-effect');
            if (weatherCode === 'snow') body.classList.add('snow-effect');
            if (weatherCode === 'thunderstorm') body.classList.add('thunderstorm-effect');
            
            document.getElementById('timeOfDayLabel').textContent = getTimeOfDayLabel(timeOfDay);
        }

        // ========== ТАЙМЕР ==========
        function updateTimer() {
            const now = new Date();
            
            const newTimeOfDay = getTimeOfDay(now.getHours());
            if (newTimeOfDay !== timeOfDay) {
                timeOfDay = newTimeOfDay;
                applyTheme();
            }
            
            const newYear = new Date(2027, 0, 1, 0, 0, 0);
            const diff = newYear - now;
            
            if (diff <= 0) {
                document.getElementById('days').textContent = '🎉';
                document.getElementById('hours').textContent = 'С';
                document.getElementById('minutes').textContent = 'НОВЫМ';
                document.getElementById('seconds').textContent = 'ГОДОМ!';
                document.getElementById('weatherMessage').textContent = '🎅 С Новым 2027 годом! Счастья, здоровья и успехов! 🎄✨';
                document.getElementById('timeOfDayLabel').textContent = '🎆';
                return;
            }
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // ========== ЗАПУСК ==========
        async function init() {
            timeOfDay = getTimeOfDay(new Date().getHours());
            applyTheme();
            
            updateTimer();
            setInterval(updateTimer, 1000);
            
            // Пробуем автоматически определить город по IP
            const ipSuccess = await getLocationByIP();
            
            if (ipSuccess) {
                // Пробуем получить погоду по координатам
                const weatherSuccess = await getWeather(userLat, userLon, userCity);
                if (!weatherSuccess) {
                    showManualInput();
                }
            } else {
                showManualInput();
            }
            
            // Вешаем обработчик на кнопку ручного ввода
            document.getElementById('cityBtn').addEventListener('click', handleManualCity);
            
            // Обработка Enter в поле ввода
            document.getElementById('cityInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleManualCity();
                }
            });
        }

        init();
    </script>
</body>
</html>
