<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скоро открытие!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0d0d0d 0%, #1a0033 50%, #0d0d0d 100%);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            text-align: center; padding: 20px; position: relative; overflow: hidden;
        }
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.3), transparent),
                              radial-gradient(1px 1px at 30% 50%, rgba(255,255,255,0.2), transparent),
                              radial-gradient(1.5px 1.5px at 50% 30%, rgba(255,255,255,0.4), transparent),
                              radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,0.3), transparent),
                              radial-gradient(1.5px 1.5px at 90% 40%, rgba(255,255,255,0.2), transparent);
            pointer-events: none; z-index: 0;
        }
        .content { position: relative; z-index: 1; }
        .badge {
            display: inline-block; padding: 10px 28px; border: 1px solid rgba(255,255,255,0.3);
            border-radius: 50px; color: rgba(255,255,255,0.7); letter-spacing: 4px;
            font-size: 0.8em; text-transform: uppercase; margin-bottom: 30px;
        }
        h1 { color: #fff; font-size: 3em; font-weight: 800; margin-bottom: 10px; letter-spacing: 2px; }
        .accent { background: linear-gradient(135deg, #a855f7, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .subtitle { color: rgba(255,255,255,0.5); font-size: 1.1em; margin-bottom: 40px; }
        
        .timer { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 45px; }
        .timer-item { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 20px; min-width: 90px; }
        .timer-item .number { font-size: 2.5em; font-weight: 800; color: #fff; }
        .timer-item .label { color: rgba(255,255,255,0.4); font-size: 0.75em; text-transform: uppercase; letter-spacing: 2px; margin-top: 5px; }
        
        .subscribe { display: flex; gap: 10px; max-width: 420px; margin: 0 auto; flex-wrap: wrap; justify-content: center; }
        .subscribe input { flex: 1; min-width: 200px; padding: 14px 18px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); color: #fff; font-size: 0.9em; font-family: inherit; }
        .subscribe input:focus { outline: none; border-color: #a855f7; }
        .subscribe button { padding: 14px 28px; border-radius: 50px; background: linear-gradient(135deg, #a855f7, #6366f1); color: #fff; border: none; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: all 0.3s; }
        .subscribe button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(168,85,247,0.4); }
        
        .success { display: none; color: #a855f7; margin-top: 20px; font-weight: 600; animation: fadeIn 0.4s ease; }
        .success.show { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="content">
        <div class="badge">Скоро запуск</div>
        <h1>Мы почти <span class="accent">готовы</span></h1>
        <p class="subtitle">Наш новый проект запускается через:</p>
        
        <div class="timer">
            <div class="timer-item"><span class="number" id="days">00</span><span class="label">Дней</span></div>
            <div class="timer-item"><span class="number" id="hours">00</span><span class="label">Часов</span></div>
            <div class="timer-item"><span class="number" id="minutes">00</span><span class="label">Минут</span></div>
            <div class="timer-item"><span class="number" id="seconds">00</span><span class="label">Секунд</span></div>
        </div>
        
        <p style="color: rgba(255,255,255,0.5); margin-bottom: 15px; font-size: 0.9em;">Оставьте email, чтобы узнать первым:</p>
        <div class="subscribe">
            <input type="email" id="emailInput" placeholder="your@email.com">
            <button onclick="subscribe()">Уведомить</button>
        </div>
        <div class="success" id="successMsg">✅ Спасибо! Мы сообщим вам о запуске.</div>
    </div>

    <script>
        function updateTimer() {
            const launchDate = new Date();
            launchDate.setDate(launchDate.getDate() + 14);
            const diff = launchDate - new Date();
            
            if (diff <= 0) {
                document.getElementById('days').textContent = '🎉';
                document.getElementById('hours').textContent = 'GO';
                document.getElementById('minutes').textContent = 'LI';
                document.getElementById('seconds').textContent = 'VE';
                return;
            }
            
            document.getElementById('days').textContent = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
            document.getElementById('hours').textContent = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60))).padStart(2, '0');
            document.getElementById('minutes').textContent = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
            document.getElementById('seconds').textContent = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
        }
        updateTimer(); setInterval(updateTimer, 1000);
        
        function subscribe() {
            const email = document.getElementById('emailInput').value;
            if (email.includes('@') && email.includes('.')) {
                document.getElementById('successMsg').classList.add('show');
                document.getElementById('emailInput').value = '';
            } else {
                alert('Пожалуйста, введите корректный email');
            }
        }
    </script>
</body>
</html>
